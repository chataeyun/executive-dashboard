<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f18">
<meta name="description" content="메인 비서와 서브 워커의 7개 트랙 진행 상황을 한 화면에서 보는 통합 관제 대시보드입니다.">
<title>AI 비서실 통합 관제탑</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1220'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%235b8cff' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%233fd0d4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🎛️</span>
      <div class="brand-text">
        <h1 id="app-title">AI 비서실 통합 관제탑</h1>
        <p id="app-sub" class="brand-sub">7개 트랙 · 메인/서브 분담 운영</p>
      </div>
    </div>
    <div class="top-meta">
      <span class="sync" title="status.json이 마지막으로 갱신된 시각">
        <span class="sync-dot" aria-hidden="true"></span>
        마지막 동기화 <strong id="sync-time">—</strong>
      </span>
      <span class="tag-public">🔒 공개 배포용</span>
    </div>
  </div>

  <div class="roles" id="roles" aria-label="역할 분담"></div>

  <div class="progress-wrap">
    <div class="progress-head">
      <span class="progress-title" id="overall-title">전체 진행률</span>
      <span class="progress-pct" id="overall-pct">—</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="overall-bar-wrap">
      <div class="bar-fill" id="overall-bar"></div>
    </div>
    <p class="progress-meta" id="overall-meta">상태를 불러오는 중입니다…</p>
  </div>
</header>

<nav class="filters" aria-label="필터">
  <div class="chip-row" id="track-filters" role="tablist" aria-label="트랙 선택"></div>
  <div class="chip-row chip-row-role" id="role-filters" role="group" aria-label="담당 선택"></div>
</nav>

<main class="page">
  <section id="alerts" class="alerts" aria-label="확인 필요 항목"></section>
  <section id="tracks" class="grid" aria-label="7대 트랙"></section>
  <p id="empty" class="empty" hidden>표시할 트랙이 없습니다. 필터를 전체로 바꿔 보세요.</p>
  <section id="fallback" class="fallback" hidden>
    <h2>상태 파일을 읽지 못했습니다</h2>
    <p><code>data/status.json</code>을 불러오지 못했습니다. 로컬에서 열었다면 <code>python3 -m http.server</code> 같은 간단한 서버로 열어 주세요.</p>
  </section>
</main>

<footer class="foot">
  <div class="foot-inner">
    <p class="foot-note" id="privacy-note"></p>
    <div class="foot-actions">
      <button type="button" id="reset-checks" class="btn-ghost">내 체크 초기화</button>
      <span class="foot-build" id="foot-build"></span>
    </div>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
